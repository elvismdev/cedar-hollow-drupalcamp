# Overrides pantheon.upstream.yml. The upstream already sets PHP 8.3 and
# MariaDB 10.6; repeating them pins the values if the upstream default changes.
api_version: 1
php_version: 8.3
database:
  version: 10.6

# No frontend_build: the theme ships its CSS and JavaScript as committed files,
# and its only build is Storybook, which is published to GitHub Pages. A
# Storybook built here would be served on the Drupal origin, where a built
# preview accepts story updates by postMessage from any origin.
