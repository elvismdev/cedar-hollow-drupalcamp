$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Callout
status: stable
group: Components
description: "An image with a title, teaser and button, stacked or side by side. Ported from Surface."
props:
  type: object
  required: [heading]
  properties:
    heading:
      type: string
      title: Heading
      examples: ["Two days, three tracks"]
    teaser:
      type: string
      title: Teaser
      contentMediaType: text/html
      x-formatting-context: block
      examples: ["<p>Sessions on front end, back end and site building.</p>"]
    cta_text:
      type: string
      title: Button text
      examples: ["Browse sessions"]
    cta_url:
      type: string
      title: Button URL
      format: uri-reference
      examples: ["/sessions"]
    cta_variant:
      type: string
      title: Button variant
      enum: ["primary", "secondary", "outlined"]
      examples: ["primary"]
    layout:
      type: string
      title: Layout
      enum: ["stacked", "horizontal", "horizontal-reversed"]
      examples: ["stacked"]
    style:
      type: string
      title: Style
      enum: ["default", "quote"]
      examples: ["default"]
slots:
  image:
    title: Image
