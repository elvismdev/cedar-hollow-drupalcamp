$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Quote
status: stable
group: Components
description: "A quotation with its author, with or without an image. Ported from Surface."
props:
  type: object
  required: [author]
  properties:
    image:
      title: Image
      $ref: json-schema-definitions://canvas.module/image
      type: object
      examples:
        - src: placeholder.png
          alt: Placeholder image
          width: 768
          height: 512
    quote:
      type: string
      title: Quote
      contentMediaType: text/html
      x-formatting-context: block
      examples: ["<p>Build the component once and every page builder can use it.</p>"]
    author:
      type: string
      title: Author
      examples: ["A camp organiser"]
