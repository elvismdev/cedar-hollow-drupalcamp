$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Filter group
status: stable
group: Components
description: "A labelled group of filter options."
props:
  type: object
  required: [legend]
  properties:
    legend:
      type: string
      title: Legend
      examples: ["Track"]
    required:
      type: boolean
      title: Required
      examples: [false]
    description_id:
      type: string
      title: Description ID
      description: "The id the fieldset's aria-describedby points at."
      examples: ["edit-track--wrapper--description"]
slots:
  options:
    title: Options
  errors:
    title: Errors
  description:
    title: Description
