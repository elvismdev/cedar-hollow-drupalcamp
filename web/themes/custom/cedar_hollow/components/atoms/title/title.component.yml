$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Title
status: stable
group: Atoms
description: "A heading at a chosen level, optionally linked. Ported from Surface."
props:
  type: object
  required: [text]
  properties:
    text:
      type: string
      title: Text
      examples: ["A vibrant, supportive culture"]
    level:
      type: string
      title: Level
      enum: ["2", "3", "4", "5", "6"]
      examples: ["2"]
    size:
      type: string
      title: Size
      enum: ["small", "medium", "large"]
      examples: ["medium"]
    url:
      type: string
      title: URL
      format: uri-reference
      examples: ["/sessions"]
