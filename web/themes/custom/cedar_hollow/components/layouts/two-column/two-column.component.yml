$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Two columns
status: stable
group: Layouts
description: "Primary and secondary columns that stack on small screens."
props:
  type: object
  properties:
    ratio:
      type: string
      title: Ratio
      enum: ["50-50", "60-40", "40-60"]
      examples: ["60-40"]
slots:
  primary:
    title: Primary
  secondary:
    title: Secondary
