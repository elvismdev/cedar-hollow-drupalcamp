css:
  original: |
    /**
     * @file
     * Agenda builder code component. Reads the theme's tokens, which every page
     * loads, and reuses the button and seats-indicator classes.
     */

    @layer reset, tokens, base, atoms, components, collections, layouts, utilities;

    @layer collections {
      .agenda-builder {
        container: agenda-builder / inline-size;
        display: grid;
        gap: var(--size-4);
      }

      .agenda-builder__heading {
        margin: 0;
        font-size: var(--font-size-7);
      }

      .agenda-builder__notices {
        display: grid;
        gap: var(--size-1);
      }

      .agenda-builder__freshness,
      .agenda-builder__status {
        margin: 0;
        color: var(--color-text-muted);
        font-size: var(--font-size-0);
      }

      .agenda-builder__notice {
        margin: 0;
        padding: var(--size-2) var(--size-3);
        border-inline-start: var(--border-size-4) solid var(--color-warning);
        background-color: var(--color-warning-soft);
      }

      .agenda-builder__day-heading {
        margin-block: var(--size-4) var(--size-2);
        font-size: var(--font-size-3);
      }

      .agenda-builder__list {
        display: grid;
        gap: var(--size-3);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .agenda-builder__session {
        display: grid;
        gap: var(--size-3);
        padding: var(--size-4);
        border: var(--border-size-1) solid var(--color-border-soft);
        border-inline-start-width: var(--border-size-5);
        border-radius: var(--radius-2);
        background-color: var(--color-surface);

        &.is-picked {
          border-inline-start-color: var(--color-accent);
        }
      }

      .agenda-builder__time,
      .agenda-builder__meta {
        margin: 0;
        color: var(--color-text-muted);
        font-size: var(--font-size-0);
      }

      .agenda-builder__title {
        margin: var(--size-1) 0;
        font-size: var(--font-size-3);
      }

      .agenda-builder__conflict {
        margin: var(--size-2) 0 0;
        color: var(--color-danger);
        font-weight: var(--font-weight-700);
      }

      .agenda-builder__actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--size-2);
        align-items: center;
      }

      @container agenda-builder (inline-size >= 40rem) {
        .agenda-builder__session {
          grid-template-columns: 1fr auto;
          align-items: start;
        }
      }
    }
