# deploy-dev.yml starts when this workflow, matched by the name "CI", succeeds
# on main. Renaming it stops deploys, and adding if: or continue-on-error to a
# job would let a deploy run without that job passing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP standards, static analysis and security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
          tools: composer:v2
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress
      - name: Known vulnerabilities in PHP dependencies, Drupal advisories included
        run: composer audit
      - name: Drupal coding standards
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  theme:
    name: Theme CSS, component hierarchy, Storybook build and tests, and npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/themes/custom/cedar_hollow/package-lock.json
            tests/package-lock.json
      # Storybook loads core's hidden.module.css, so Drupal core must be present.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --no-dev
      - run: npm ci
        working-directory: web/themes/custom/cedar_hollow
      - name: Stylelint, check_css.py and check_hierarchy.py
        run: npm run lint:css
        working-directory: web/themes/custom/cedar_hollow
      - run: npm ci
        working-directory: tests
      - name: Known vulnerabilities in npm packages, less reviewed exceptions
        run: node scripts/npm-audit-check.mjs web/themes/custom/cedar_hollow tests
      - run: npm run build
        working-directory: web/themes/custom/cedar_hollow
      # Every story runs as a test in headless Chromium and fails on an axe violation.
      - name: Chromium for Storybook Test
        run: npx playwright install --with-deps chromium
        working-directory: web/themes/custom/cedar_hollow
      - name: Storybook Test
        run: npm run test:storybook
        working-directory: web/themes/custom/cedar_hollow
      - uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: web/themes/custom/cedar_hollow/storybook
          retention-days: 7

  phpunit:
    name: PHPUnit (kernel and functional)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
    env:
      SIMPLETEST_DB: mysql://root:root@127.0.0.1:3306/drupal
      SIMPLETEST_BASE_URL: http://127.0.0.1:8080
      BROWSERTEST_OUTPUT_DIRECTORY: ${{ github.workspace }}/web/sites/simpletest/browser_output
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Serve Drupal for functional tests
        run: |
          mkdir -p web/sites/simpletest/browser_output
          # Started from the docroot: the server resolves the router path from there.
          cd web && php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &
        # The built-in server handles one request at a time unless told otherwise.
        env:
          PHP_CLI_SERVER_WORKERS: '8'
      - run: vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/cedar_hollow_core
      - if: failure()
        run: tail -n 100 /tmp/php-server.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-browser-output
          path: web/sites/simpletest/browser_output
          retention-days: 7

  e2e:
    name: Playwright end-to-end, accessibility and smoke on a site rebuilt from code
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_URL: https://cedar-hollow.ddev.site
    steps:
      - uses: actions/checkout@v7
      - uses: ddev/github-action-setup-ddev@v1
      - name: Rebuild the site from configuration and the content recipe
        run: scripts/rebuild.sh
      - name: Build the theme's Storybook (served by Drupal for the BEM parity test)
        run: ddev exec -d /var/www/html/web/themes/custom/cedar_hollow "npm ci && npm run build"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # --with-deps runs apt-get update, which can hang on an unreachable
      # Ubuntu mirror, so a stalled install fails here instead of at the job's
      # 60-minute limit.
      - run: npm ci && npx playwright install --with-deps chromium
        timeout-minutes: 10
        working-directory: tests
      # Core answers 503 to a second request for a derivative another request
      # is still generating, which parallel test workers hit on a cold site, so
      # the derivatives are generated one at a time first. Node trusts DDEV's
      # certificate through mkcert.
      - name: Warm image derivatives
        working-directory: tests
        run: NODE_EXTRA_CA_CERTS="$(mkcert -CAROOT)/rootCA.pem" npm run warm -- "$BASE_URL"
      - run: npx playwright test --project=e2e --project=a11y --project=smoke
        working-directory: tests
      # Actions has no step retry, so the shell runs the check once more only
      # if the first run fails.
      - name: Check LCP and CLS with Lighthouse CI
        timeout-minutes: 20
        working-directory: tests
        run: |
          # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run test:perf || npm run test:perf
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: tests/perf/reports
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e
          path: |
            tests/test-results
            tests/a11y-results
          retention-days: 7

  reviewer-tools:
    name: Reviewer tools tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Full history: the suites build repositories and merges from it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Git identity for the suites that create commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Run every reviewer and hook test suite
        run: |
          mapfile -t suites < <(find .github/claude-review/tools .claude/hooks -name '*.test.sh' | sort)
          echo "Found ${#suites[@]} suites"
          if [ "${#suites[@]}" -eq 0 ]; then echo "No test suites found" >&2; exit 1; fi
          failed=()
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            bash "$suite" || failed+=("$suite")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed suites (${#failed[@]} of ${#suites[@]}):" >&2
            printf '  %s\n' "${failed[@]}" >&2
            exit 1
          fi
      - name: Shellcheck
        run: |
          find .github/claude-review .claude/hooks -name '*.sh' -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning .github/security-audit/*.sh .github/security-audit/tests/*.sh scripts/rebuild.sh
      - name: Workflow and action checks
        run: bash .github/claude-review/tools/check-actions.sh
      - name: Pinned Claude Code version matches the review action
        run: bash .github/claude-review/tools/check-cli-version.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # The audit's sandbox test builds a Drupal site on SQLite with
      # scripts/rebuild.sh, which puts a site build in this required check: a
      # broken build blocks pull requests and, because Dev deploys need CI
      # green on main, stops Dev deploys until it is fixed.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, curl
          tools: composer:v2
      - name: Install bubblewrap and age
        run: sudo apt-get install -y bubblewrap age
      # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the security audit tests
        run: |
          shopt -s nullglob
          suites=(.github/security-audit/tests/*.test.sh scripts/rebuild.test.sh)
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            bash "$suite" || failed+=("$suite")
            echo "::endgroup::"
          done
          echo "Ran ${#suites[@]} audit shell suites"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed suites (${#failed[@]} of ${#suites[@]}):" >&2
            printf '  %s\n' "${failed[@]}" >&2
            exit 1
          fi
          pyfiles=(.github/security-audit/tests/test_*.py)
          if [ "${#pyfiles[@]}" -gt 0 ]; then
            python3 -m unittest discover -s .github/security-audit/tests -p 'test_*.py'
          fi

  visual:
    name: Visual regression on Storybook templates
    needs: theme
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same image the baselines were made in, so fonts and rendering match.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: storybook
          path: web/themes/custom/cedar_hollow/storybook
      - run: npm ci
        working-directory: tests
      - run: npx playwright test --project=visual
        working-directory: tests
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: tests/test-results
          retention-days: 7
