name: Publish Storybook

# Publishes the theme's static Storybook to GitHub Pages, on its own origin.
# A built Storybook preview accepts story updates by postMessage from any
# origin, so it must never be served on the Drupal site's origin. Runs only on
# pushes to main in this repository; pull requests, forks included, never
# trigger it. The build uses relative URLs, so it works under the project
# sub-path without a base setting.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # Storybook loads core's hidden.module.css, so Drupal core must be present.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --no-dev
      - run: npm ci
        working-directory: web/themes/custom/cedar_hollow
      - run: npm run build
        working-directory: web/themes/custom/cedar_hollow
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/storybook

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
