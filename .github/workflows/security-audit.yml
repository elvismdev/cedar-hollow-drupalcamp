name: Security audit

# The monthly security audit (docs/designs/security-audit.md), dispatched by
# hand until the schedule is added. Each job lists prepare in needs and runs
# only when prepare says go, on main, and when prepare's run_jobs names it, so
# a canary run starts only the jobs its row needs.
#
# Job ids must equal the names prepare.sh writes into run_jobs, and the
# publishing job must stay named report: check-audit-health.sh counts a run
# as an audit only when its job named report succeeded.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the issue. false keeps the rendered body as a sealed artifact.
        type: boolean
        default: true
      canary:
        description: A controls canary to run instead of the audit (forces publish to false)
        type: choice
        default: none
        options:
          - none
          - denied-read
          - denied-write
          - subagent-bash
          - subagent-findings-write
          - script-isolation
          - sandbox-secrets
          - reopen-records

permissions: {}

concurrency:
  group: security-audit
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The names envsubst replaces in a prompt, and no others.
  PROMPT_VARS: '$RUN_ID $SOURCE_REF $OUTPUT_DIR $INPUT_DIR $BUDGET $SCOPE_PATHS $GITHUB_ENV_PATH $HOME $RUNNER_TEMP'
  # The tools check-agent-run.sh accepts in a trace: the subagent tool under
  # both of its names, and Write and Edit, which the Edit(//<out>/**) allow
  # rule limits to the job's output directory.
  AGENT_TOOLS: Read,Glob,Grep,Write,Edit,Agent,Task
  REPAIR_TOOLS: Read,Glob,Grep,Write,Edit

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.prepare.outputs.go }}
      publish: ${{ steps.prepare.outputs.publish }}
      canary: ${{ steps.prepare.outputs.canary }}
      run_jobs: ${{ steps.prepare.outputs.run_jobs }}
      metadata_sha256: ${{ steps.metadata.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Decide whether the audit runs and write run-metadata.json
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          CANARY: ${{ inputs.canary }}
        run: bash .github/security-audit/prepare.sh "$(date -u +%F)" "$EVENT" "$PUBLISH" "$CANARY" "$RUNNER_TEMP/meta" >> "$GITHUB_OUTPUT"

      - name: Hash run-metadata.json
        id: metadata
        if: steps.prepare.outputs.go == 'true'
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/meta/run-metadata.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.prepare.outputs.go == 'true'
        with:
          name: run-metadata
          path: ${{ runner.temp }}/meta/run-metadata.json
          retention-days: 1
          if-no-files-found: error

  source:
    needs: prepare
    if: needs.prepare.outputs.go == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.prepare.outputs.run_jobs), 'source')
    runs-on: ubuntu-24.04
    environment: claude-agents
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
      issues: read
    env:
      AUDIT_INPUT_DIR: /mnt/audit/source/in
      AUDIT_OUTPUT_DIR: /mnt/audit/source/out
    outputs:
      sha256: ${{ steps.handoff.outputs.sha256 }}
      validators: ${{ steps.validators-final.outputs.validators }}
      cause: ${{ steps.cause.outputs.cause }}
      prior_marker: ${{ steps.marker.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install age, and envsubst where the image lacks it
        run: |
          pkgs=(age)
          command -v envsubst >/dev/null || pkgs+=(gettext-base)
          sudo apt-get install -y "${pkgs[@]}"

      # The private key cannot be read back once set, so each run proves it
      # still pairs with the committed public key: a fresh random token sealed
      # to agents.pub must open to the same token, and one sealed to
      # sandbox.pub must not open with this key.
      - name: Check the agents key against both public keys
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
        run: |
          dir=$(mktemp -d)
          mkdir "$dir/in" "$dir/open" "$dir/other"
          token=$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')
          printf '%s\n' "$token" > "$dir/in/token"
          own=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$dir/in" "$dir/own.age")
          if ! bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$own" "$dir/own.age" "$dir/open" \
            || [ "$(cat "$dir/open/token")" != "$token" ]; then
            echo "::error::a token sealed to agents.pub did not open to itself with AUDIT_AGENTS_AGE_KEY"
            exit 1
          fi
          other=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/sandbox.pub "$dir/in" "$dir/other.age")
          if bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$other" "$dir/other.age" "$dir/other"; then
            echo "::error::AUDIT_AGENTS_AGE_KEY opened a token sealed to sandbox.pub"
            exit 1
          fi
          rm -rf "$dir"
          echo "AUDIT_AGENTS_AGE_KEY opens what is sealed to agents.pub and not what is sealed to sandbox.pub"

      # A canary that tests the source agent runs the agent with its canary
      # prompt and no merge or hand-off; a canary that tests a later job skips
      # the source agent and hands off run-metadata.json alone.
      - name: Decide which parts of this job run
        id: plan
        env:
          CANARY: ${{ needs.prepare.outputs.canary }}
        run: |
          case "$CANARY" in
            none) agent=true merge=true handoff=true ;;
            denied-read|denied-write|subagent-bash|subagent-findings-write) agent=true merge=false handoff=false ;;
            script-isolation|sandbox-secrets|reopen-records) agent=false merge=false handoff=true ;;
            *) echo "::error::unknown canary"; exit 1 ;;
          esac
          printf 'agent=%s\nmerge=%s\nhandoff=%s\n' "$agent" "$merge" "$handoff" >> "$GITHUB_OUTPUT"

      - name: Create the working directories
        run: |
          sudo mkdir -p "$AUDIT_INPUT_DIR" "$AUDIT_OUTPUT_DIR"
          sudo chown -R "$(id -u):$(id -g)" /mnt/audit/source

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: run-metadata
          path: ${{ runner.temp }}/meta

      - name: Check run-metadata.json and place it in the output directory
        env:
          SHA256: ${{ needs.prepare.outputs.metadata_sha256 }}
        run: |
          actual=$(sha256sum "$RUNNER_TEMP/meta/run-metadata.json" | cut -d' ' -f1)
          if [ "$actual" != "$SHA256" ]; then
            echo "::error::run-metadata.json is not the file prepare wrote (expected $SHA256, got $actual)"
            exit 1
          fi
          cp "$RUNNER_TEMP/meta/run-metadata.json" "$AUDIT_OUTPUT_DIR/run-metadata.json"

      - name: Fetch the prior audit state
        id: prior
        if: steps.plan.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/security-audit/fetch-prior-state.sh "$REPO" "$RUNNER_TEMP/prior" >> "$GITHUB_OUTPUT"

      # The marker, public in the issue already, is what the report lists as
      # "not re-checked this run" when this run cannot re-check it.
      - name: Pass the prior state marker to the report
        id: marker
        if: steps.prior.outputs.marker != ''
        env:
          MARKER: ${{ steps.prior.outputs.marker }}
        run: echo "json=$(jq -c . "$MARKER")" >> "$GITHUB_OUTPUT"

      # The opened files are named in run-metadata.json before the agent
      # starts, and the prior findings.json is passed to select-poc --prior
      # by this step's output, never read back from a file an agent can write.
      - name: Open the prior state and name it in run-metadata.json
        id: prior-open
        if: steps.prior.outputs.found == 'true'
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
          SHA256: ${{ steps.prior.outputs.sha256 }}
          STATE: ${{ steps.prior.outputs.state }}
        run: |
          bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$SHA256" "$STATE" "$AUDIT_INPUT_DIR"
          paths=()
          for name in findings.json coverage-ledger.json disputed.json audit-history.json; do
            if [ -f "$AUDIT_INPUT_DIR/$name" ] && [ ! -L "$AUDIT_INPUT_DIR/$name" ]; then
              paths+=("$AUDIT_INPUT_DIR/$name")
            fi
          done
          meta="$AUDIT_OUTPUT_DIR/run-metadata.json"
          jq '.prior_run_paths = $ARGS.positional' "$meta" --args "${paths[@]}" > "$RUNNER_TEMP/run-metadata.json"
          cat "$RUNNER_TEMP/run-metadata.json" > "$meta"
          if [ -f "$AUDIT_INPUT_DIR/findings.json" ] && [ ! -L "$AUDIT_INPUT_DIR/findings.json" ]; then
            echo "findings=$AUDIT_INPUT_DIR/findings.json" >> "$GITHUB_OUTPUT"
          fi
          echo "prior state opened: ${#paths[@]} file(s)"

      - name: Compose the source agent's arguments
        id: args-source
        if: steps.plan.outputs.agent == 'true'
        run: |
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit > "$RUNNER_TEMP/agent-args"
          line=$(grep '^AGENT_ARGS_AUDIT_SOURCE=' "$RUNNER_TEMP/agent-args")
          echo "claude_args=${line#AGENT_ARGS_AUDIT_SOURCE=}" >> "$GITHUB_OUTPUT"
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit-models source >> "$GITHUB_OUTPUT"

      - name: Render the source prompt
        id: prompt-source
        if: steps.plan.outputs.agent == 'true'
        env:
          CANARY: ${{ needs.prepare.outputs.canary }}
        run: |
          meta="$RUNNER_TEMP/meta/run-metadata.json"
          export RUN_ID="$GITHUB_RUN_ID" SOURCE_REF="$GITHUB_SHA" GITHUB_ENV_PATH="$GITHUB_ENV"
          export OUTPUT_DIR="$AUDIT_OUTPUT_DIR" INPUT_DIR="$AUDIT_INPUT_DIR"
          BUDGET=$(jq -r .budget "$meta")
          SCOPE_PATHS=$(jq -r '.scope_paths | join(", ")' "$meta")
          export BUDGET SCOPE_PATHS
          envsubst "$PROMPT_VARS" < .github/security-audit/prompts/source.md > "$RUNNER_TEMP/prompt-source.md"
          if [ "$CANARY" != none ]; then
            envsubst "$PROMPT_VARS" < ".github/security-audit/prompts/canary-$CANARY.md" >> "$RUNNER_TEMP/prompt-source.md"
          fi
          bash .github/claude-review/tools/agent/emit-block.sh prompt "$RUNNER_TEMP/prompt-source.md" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the checkout and ~/.claude before the source agent
        id: before-source
        if: steps.plan.outputs.agent == 'true'
        run: |
          bash .github/security-audit/check-agent-run.sh --fingerprint "$RUNNER_TEMP/fingerprint-source"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      # github_token is passed so the action uses it instead of exchanging an
      # OIDC token for its app token. show_full_output and display_report stay
      # false: either would put agent output in the public log or summary.
      - name: Source agent
        id: agent-source
        if: steps.plan.outputs.agent == 'true'
        continue-on-error: true
        timeout-minutes: 280
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.args-source.outputs.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.args-source.outputs.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.args-source.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt-source.outputs.prompt }}
          claude_args: ${{ steps.args-source.outputs.claude_args }}
          show_full_output: 'false'
          display_report: 'false'

      - name: Record when the source agent ended
        id: after-source
        if: always() && steps.plan.outputs.agent == 'true'
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

      # A failed run check fails the job, so every later step without
      # always() is skipped and nothing is handed off.
      - name: Run check (source agent)
        id: check-source
        if: always() && steps.plan.outputs.agent == 'true'
        env:
          TRACE: ${{ steps.agent-source.outputs.execution_file }}
          MODEL: ${{ steps.args-source.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        run: bash .github/security-audit/check-agent-run.sh source "$TRACE" "$AGENT_TOOLS" "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/fingerprint-source" "$MODEL"

      - name: Outcome (source agent)
        id: outcome-source
        if: always() && steps.plan.outputs.agent == 'true'
        env:
          TRACE: ${{ steps.agent-source.outputs.execution_file }}
          OUTCOME: ${{ steps.agent-source.outcome }}
          STARTED: ${{ steps.before-source.outputs.started }}
          ENDED: ${{ steps.after-source.outputs.ended }}
        run: |
          cause=$(bash .github/security-audit/agent-outcome.sh "$TRACE" "$OUTCOME" "$STARTED" "$ENDED" 280 "$AUDIT_OUTPUT_DIR/findings.json" "$AUDIT_OUTPUT_DIR/coverage-ledger.json")
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "source agent: $cause"

      # count --job source runs first: it creates trusted-meta.json, which
      # every later subcommand reads instead of anything the agent wrote.
      - name: Count the source agent's subagents
        if: always() && steps.check-source.outcome == 'success' && steps.plan.outputs.merge == 'true'
        env:
          TRACE: ${{ steps.agent-source.outputs.execution_file }}
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" count --job source --cap 60 --trace "$TRACE"

      # The validators' output can quote record text, so it goes only to
      # validator-errors.txt, which the repair agent reads and the hand-off
      # seals; the log shows exit codes and a count.
      - name: Validators (after the source agent)
        id: validators-source
        if: always() && steps.check-source.outcome == 'success' && steps.plan.outputs.merge == 'true'
        run: |
          errors="$AUDIT_OUTPUT_DIR/validator-errors.txt"
          f=0 l=0
          node .github/security-audit/skill/validate-findings.cjs "$AUDIT_OUTPUT_DIR/findings.json" > "$errors" 2>&1 || f=$?
          node .github/security-audit/skill/validate-coverage-ledger.cjs "$AUDIT_OUTPUT_DIR/coverage-ledger.json" >> "$errors" 2>&1 || l=$?
          echo "validate-findings exit $f, validate-coverage-ledger exit $l, $(grep -c '^ERROR' "$errors" || true) error line(s)"
          if [ "$f" -eq 0 ] && [ "$l" -eq 0 ]; then result=pass; else result=fail; fi
          echo "validators=$result" >> "$GITHUB_OUTPUT"

      - name: Compose the repair agent's arguments
        id: args-repair
        if: steps.validators-source.outputs.validators == 'fail'
        run: |
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit > "$RUNNER_TEMP/agent-args"
          line=$(grep '^AGENT_ARGS_AUDIT_REPAIR=' "$RUNNER_TEMP/agent-args")
          echo "claude_args=${line#AGENT_ARGS_AUDIT_REPAIR=}" >> "$GITHUB_OUTPUT"
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit-models repair >> "$GITHUB_OUTPUT"

      - name: Render the repair prompt
        id: prompt-repair
        if: steps.validators-source.outputs.validators == 'fail'
        run: |
          meta="$RUNNER_TEMP/meta/run-metadata.json"
          export RUN_ID="$GITHUB_RUN_ID" SOURCE_REF="$GITHUB_SHA" GITHUB_ENV_PATH="$GITHUB_ENV"
          export OUTPUT_DIR="$AUDIT_OUTPUT_DIR" INPUT_DIR="$AUDIT_INPUT_DIR"
          BUDGET=$(jq -r .budget "$meta")
          SCOPE_PATHS=$(jq -r '.scope_paths | join(", ")' "$meta")
          export BUDGET SCOPE_PATHS
          envsubst "$PROMPT_VARS" < .github/security-audit/prompts/repair.md > "$RUNNER_TEMP/prompt-repair.md"
          bash .github/claude-review/tools/agent/emit-block.sh prompt "$RUNNER_TEMP/prompt-repair.md" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the checkout and ~/.claude before the repair agent
        id: before-repair
        if: steps.validators-source.outputs.validators == 'fail'
        run: |
          bash .github/security-audit/check-agent-run.sh --fingerprint "$RUNNER_TEMP/fingerprint-repair"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Repair agent
        id: agent-repair
        if: steps.validators-source.outputs.validators == 'fail'
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.args-repair.outputs.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.args-repair.outputs.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.args-repair.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt-repair.outputs.prompt }}
          claude_args: ${{ steps.args-repair.outputs.claude_args }}
          show_full_output: 'false'
          display_report: 'false'

      - name: Record when the repair agent ended
        id: after-repair
        if: always() && steps.validators-source.outputs.validators == 'fail'
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run check (repair agent)
        id: check-repair
        if: always() && steps.validators-source.outputs.validators == 'fail'
        env:
          TRACE: ${{ steps.agent-repair.outputs.execution_file }}
          MODEL: ${{ steps.args-repair.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        run: bash .github/security-audit/check-agent-run.sh source "$TRACE" "$REPAIR_TOOLS" "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/fingerprint-repair" "$MODEL"

      - name: Outcome (repair agent)
        id: outcome-repair
        if: always() && steps.validators-source.outputs.validators == 'fail'
        env:
          TRACE: ${{ steps.agent-repair.outputs.execution_file }}
          OUTCOME: ${{ steps.agent-repair.outcome }}
          STARTED: ${{ steps.before-repair.outputs.started }}
          ENDED: ${{ steps.after-repair.outputs.ended }}
        run: |
          cause=$(bash .github/security-audit/agent-outcome.sh "$TRACE" "$OUTCOME" "$STARTED" "$ENDED" 30 "$AUDIT_OUTPUT_DIR/findings.json" "$AUDIT_OUTPUT_DIR/coverage-ledger.json")
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "repair agent: $cause"

      - name: Count the repair agent's subagents
        if: always() && steps.check-repair.outcome == 'success'
        env:
          TRACE: ${{ steps.agent-repair.outputs.execution_file }}
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" count --job source_repair --cap 0 --trace "$TRACE"

      - name: Validators (after the repair agent)
        id: validators-repair
        if: always() && steps.check-repair.outcome == 'success'
        run: |
          errors="$AUDIT_OUTPUT_DIR/validator-errors.txt"
          f=0 l=0
          node .github/security-audit/skill/validate-findings.cjs "$AUDIT_OUTPUT_DIR/findings.json" > "$errors" 2>&1 || f=$?
          node .github/security-audit/skill/validate-coverage-ledger.cjs "$AUDIT_OUTPUT_DIR/coverage-ledger.json" >> "$errors" 2>&1 || l=$?
          echo "validate-findings exit $f, validate-coverage-ledger exit $l, $(grep -c '^ERROR' "$errors" || true) error line(s)"
          if [ "$f" -eq 0 ] && [ "$l" -eq 0 ]; then result=pass; else result=fail; fi
          echo "validators=$result" >> "$GITHUB_OUTPUT"

      - name: Stop when the records still fail the validators
        id: validators-final
        if: steps.plan.outputs.merge == 'true'
        env:
          FIRST: ${{ steps.validators-source.outputs.validators }}
          SECOND: ${{ steps.validators-repair.outputs.validators }}
        run: |
          result="${SECOND:-$FIRST}"
          echo "validators=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" != pass ]; then
            echo "::error::the records fail the validators after the repair step (validators_failed)"
            exit 1
          fi

      - name: Select the proof-of-concept items
        if: steps.plan.outputs.merge == 'true'
        env:
          PRIOR_FINDINGS: ${{ steps.prior-open.outputs.findings }}
        run: |
          if [ -n "$PRIOR_FINDINGS" ]; then
            python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" select-poc --out "$AUDIT_OUTPUT_DIR/select.json" --prior "$PRIOR_FINDINGS"
          else
            python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" select-poc --out "$AUDIT_OUTPUT_DIR/select.json"
          fi

      - name: Seal audit-source to the agents key
        id: handoff
        if: steps.plan.outputs.handoff == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          sum=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/handoff/audit-source.age")
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.handoff.outcome == 'success'
        with:
          name: audit-source
          path: ${{ runner.temp }}/handoff/audit-source.age
          retention-days: 1
          if-no-files-found: error

      # One fixed label for the report: a failed run check first, then
      # records that never passed the validators, then the last agent step's
      # outcome.
      - name: Name the job's cause
        id: cause
        if: always()
        env:
          CHECK_SOURCE: ${{ steps.check-source.outcome }}
          CHECK_REPAIR: ${{ steps.check-repair.outcome }}
          VALIDATORS: ${{ steps.validators-final.outputs.validators }}
          OUTCOME_SOURCE: ${{ steps.outcome-source.outputs.cause }}
          OUTCOME_REPAIR: ${{ steps.outcome-repair.outputs.cause }}
        run: |
          if [ "$CHECK_SOURCE" = failure ] || [ "$CHECK_REPAIR" = failure ]; then cause=run_check_failed
          elif [ "$VALIDATORS" = fail ]; then cause=validators_failed
          elif [ -n "$OUTCOME_REPAIR" ]; then cause="$OUTCOME_REPAIR"
          elif [ -n "$OUTCOME_SOURCE" ]; then cause="$OUTCOME_SOURCE"
          else cause=job_failed
          fi
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "source job: $cause"

  # The throwaway site the proof-of-concept scripts run against: public code,
  # demo content and two accounts made for this run, never deployed.
  build-site:
    needs: prepare
    if: needs.prepare.outputs.go == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.prepare.outputs.run_jobs), 'build-site')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, curl
          tools: composer:v2
          coverage: none

      - name: Copy the configuration with the sqlite driver added
        run: bash .github/security-audit/sqlite-config.sh "$RUNNER_TEMP/config-sqlite"

      # COMPOSER is unset because Composer reads it as the name of its
      # project file. The SQLite URL carries a host because Drupal drops the
      # host part, leaving the path relative to the docroot.
      - name: Build the site on SQLite
        env:
          REBUILD_COMPOSER: composer
          REBUILD_DRUSH: vendor/bin/drush
          REBUILD_DB_URL: sqlite://localhost/sites/default/files/.ht.sqlite
          REBUILD_RECIPE_PATH: ../recipes/cedar_hollow_demo_content
          REBUILD_SKIP_IMAGE_CHECK: '1'
        run: env -u COMPOSER REBUILD_CONFIG_DIR="$RUNNER_TEMP/config-sqlite" bash scripts/rebuild.sh

      # accounts.json sits beside composer.json, outside the docroot web/, so
      # the site never serves it.
      - name: Create the test accounts
        run: vendor/bin/drush php:script "$GITHUB_WORKSPACE/.github/security-audit/create-test-accounts.php" "$GITHUB_WORKSPACE/accounts.json"

      # A tarball keeps hidden files (the SQLite database) and file modes; the
      # explicit list leaves .git out.
      - name: Pack the site
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/site/audit-site.tar.gz" \
            composer.json composer.lock vendor web config recipes accounts.json
          echo "sha256=$(sha256sum "$RUNNER_TEMP/site/audit-site.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audit-site
          path: ${{ runner.temp }}/site/audit-site.tar.gz
          retention-days: 1
          if-no-files-found: error

  poc-write:
    needs: [prepare, source, build-site]
    if: needs.prepare.outputs.go == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.prepare.outputs.run_jobs), 'poc-write')
    runs-on: ubuntu-24.04
    environment: claude-agents
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      AUDIT_INPUT_DIR: /mnt/audit/poc-write/in
      AUDIT_OUTPUT_DIR: /mnt/audit/poc-write/out
    outputs:
      sandbox_sha256: ${{ steps.handoff.outputs.sandbox_sha256 }}
      scripts_sha256: ${{ steps.handoff.outputs.scripts_sha256 }}
      state_sha256: ${{ steps.handoff-state.outputs.sha256 }}
      cause: ${{ steps.cause.outputs.cause }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install age, and envsubst where the image lacks it
        run: |
          pkgs=(age)
          command -v envsubst >/dev/null || pkgs+=(gettext-base)
          sudo apt-get install -y "${pkgs[@]}"

      # script-isolation and sandbox-secrets run this agent with their canary
      # prompt; sandbox-secrets and reopen-records hand off for poc-run.
      - name: Decide which parts of this job run
        id: plan
        env:
          CANARY: ${{ needs.prepare.outputs.canary }}
        run: |
          case "$CANARY" in
            none) agent=true merge=true handoff=true ;;
            script-isolation) agent=true merge=false handoff=false ;;
            sandbox-secrets) agent=true merge=false handoff=true ;;
            reopen-records) agent=false merge=false handoff=true ;;
            *) echo "::error::poc-write does not run for this canary"; exit 1 ;;
          esac
          printf 'agent=%s\nmerge=%s\nhandoff=%s\n' "$agent" "$merge" "$handoff" >> "$GITHUB_OUTPUT"

      - name: Create the working directories
        run: |
          sudo mkdir -p "$AUDIT_INPUT_DIR" "$AUDIT_OUTPUT_DIR"
          sudo chown -R "$(id -u):$(id -g)" /mnt/audit/poc-write

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: audit-source
          path: ${{ runner.temp }}/handoff

      # Opened twice: into the input directory for the agent, and into a
      # state directory under $RUNNER_TEMP, which the agents' deny rules keep
      # out of reach, for the count.
      - name: Check and open audit-source
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
          SHA256: ${{ needs.source.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$SHA256" "$RUNNER_TEMP/handoff/audit-source.age" "$AUDIT_INPUT_DIR"
          bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$SHA256" "$RUNNER_TEMP/handoff/audit-source.age" "$RUNNER_TEMP/state"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: audit-site
          path: ${{ runner.temp }}/site

      - name: Check audit-site and unpack only accounts.json
        env:
          SHA256: ${{ needs.build-site.outputs.sha256 }}
        run: |
          actual=$(sha256sum "$RUNNER_TEMP/site/audit-site.tar.gz" | cut -d' ' -f1)
          if [ "$actual" != "$SHA256" ]; then
            echo "::error::audit-site is not the file build-site uploaded (expected $SHA256, got $actual)"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/site/audit-site.tar.gz" -C "$AUDIT_INPUT_DIR" accounts.json

      - name: Compose the poc-write agent's arguments
        id: args-poc-write
        if: steps.plan.outputs.agent == 'true'
        run: |
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit > "$RUNNER_TEMP/agent-args"
          line=$(grep '^AGENT_ARGS_AUDIT_POC_WRITE=' "$RUNNER_TEMP/agent-args")
          echo "claude_args=${line#AGENT_ARGS_AUDIT_POC_WRITE=}" >> "$GITHUB_OUTPUT"
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit-models poc_write >> "$GITHUB_OUTPUT"

      - name: Render the poc-write prompt
        id: prompt-poc-write
        if: steps.plan.outputs.agent == 'true'
        env:
          CANARY: ${{ needs.prepare.outputs.canary }}
        run: |
          export RUN_ID="$GITHUB_RUN_ID" SOURCE_REF="$GITHUB_SHA" GITHUB_ENV_PATH="$GITHUB_ENV"
          export OUTPUT_DIR="$AUDIT_OUTPUT_DIR" INPUT_DIR="$AUDIT_INPUT_DIR"
          envsubst "$PROMPT_VARS" < .github/security-audit/prompts/poc-write.md > "$RUNNER_TEMP/prompt-poc-write.md"
          if [ "$CANARY" != none ]; then
            envsubst "$PROMPT_VARS" < ".github/security-audit/prompts/canary-$CANARY.md" >> "$RUNNER_TEMP/prompt-poc-write.md"
          fi
          bash .github/claude-review/tools/agent/emit-block.sh prompt "$RUNNER_TEMP/prompt-poc-write.md" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the checkout and ~/.claude before the poc-write agent
        id: before-poc-write
        if: steps.plan.outputs.agent == 'true'
        run: |
          bash .github/security-audit/check-agent-run.sh --fingerprint "$RUNNER_TEMP/fingerprint-poc-write"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: poc-write agent
        id: agent-poc-write
        if: steps.plan.outputs.agent == 'true'
        continue-on-error: true
        timeout-minutes: 75
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.args-poc-write.outputs.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.args-poc-write.outputs.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.args-poc-write.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt-poc-write.outputs.prompt }}
          claude_args: ${{ steps.args-poc-write.outputs.claude_args }}
          show_full_output: 'false'
          display_report: 'false'

      - name: Record when the poc-write agent ended
        id: after-poc-write
        if: always() && steps.plan.outputs.agent == 'true'
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run check (poc-write agent)
        id: check-poc-write
        if: always() && steps.plan.outputs.agent == 'true'
        env:
          TRACE: ${{ steps.agent-poc-write.outputs.execution_file }}
          MODEL: ${{ steps.args-poc-write.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        run: bash .github/security-audit/check-agent-run.sh poc-write "$TRACE" "$AGENT_TOOLS" "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/fingerprint-poc-write" "$MODEL"

      - name: Outcome (poc-write agent)
        id: outcome-poc-write
        if: always() && steps.plan.outputs.agent == 'true'
        env:
          TRACE: ${{ steps.agent-poc-write.outputs.execution_file }}
          OUTCOME: ${{ steps.agent-poc-write.outcome }}
          STARTED: ${{ steps.before-poc-write.outputs.started }}
          ENDED: ${{ steps.after-poc-write.outputs.ended }}
        run: |
          cause=$(bash .github/security-audit/agent-outcome.sh "$TRACE" "$OUTCOME" "$STARTED" "$ENDED" 75 "$AUDIT_OUTPUT_DIR/poc-manifest.json")
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "poc-write agent: $cause"

      - name: Count the poc-write agent's subagents
        if: always() && steps.check-poc-write.outcome == 'success' && steps.plan.outputs.merge == 'true'
        env:
          TRACE: ${{ steps.agent-poc-write.outputs.execution_file }}
        run: python3 -I .github/security-audit/merge-records.py --state "$RUNNER_TEMP/state" count --job poc-write --cap 12 --trace "$TRACE"

      # The scripts and manifest twice: to the sandbox key for poc-run, and to
      # the agents key for poc-decide and the cross-check. On an audit run a
      # missing manifest fails the job here, so the cross-check names poc-write
      # as the failed phase.
      - name: Seal the scripts to the sandbox and agents keys
        id: handoff
        if: steps.plan.outputs.handoff == 'true'
        env:
          MERGE: ${{ steps.plan.outputs.merge }}
        run: |
          if [ "$MERGE" = true ] && [ ! -s "$AUDIT_OUTPUT_DIR/poc-manifest.json" ]; then
            echo "::error::the poc-write agent wrote no poc-manifest.json"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/handoff-out"
          sandbox=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/sandbox.pub "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/handoff-out/poc-scripts-sandbox.age")
          scripts=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/handoff-out/poc-scripts.age")
          printf 'sandbox_sha256=%s\nscripts_sha256=%s\n' "$sandbox" "$scripts" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.handoff.outcome == 'success'
        with:
          name: poc-scripts-sandbox
          path: ${{ runner.temp }}/handoff-out/poc-scripts-sandbox.age
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.handoff.outcome == 'success'
        with:
          name: poc-scripts
          path: ${{ runner.temp }}/handoff-out/poc-scripts.age
          retention-days: 1
          if-no-files-found: error

      # The state with this job's count in it, so poc-decide and the
      # cross-check carry poc-write's usage forward.
      - name: Seal the state with poc-write's count
        id: handoff-state
        if: steps.plan.outputs.merge == 'true'
        run: |
          sum=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$RUNNER_TEMP/state" "$RUNNER_TEMP/handoff-out/audit-poc-write.age")
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.handoff-state.outcome == 'success'
        with:
          name: audit-poc-write
          path: ${{ runner.temp }}/handoff-out/audit-poc-write.age
          retention-days: 1
          if-no-files-found: error

      - name: Name the job's cause
        id: cause
        if: always()
        env:
          CHECK: ${{ steps.check-poc-write.outcome }}
          OUTCOME: ${{ steps.outcome-poc-write.outputs.cause }}
        run: |
          if [ "$CHECK" = failure ]; then cause=run_check_failed
          elif [ -n "$OUTCOME" ]; then cause="$OUTCOME"
          else cause=job_failed
          fi
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "poc-write job: $cause"

  # Runs every script in a bubblewrap sandbox with no network, and holds no
  # Claude token and only the sandbox key. Each run record is sealed to the
  # agents key as soon as it is written, so this job can open none of them.
  poc-run:
    needs: [prepare, poc-write, build-site]
    if: needs.prepare.outputs.go == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.prepare.outputs.run_jobs), 'poc-run')
    runs-on: ubuntu-24.04
    environment: audit-sandbox
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, curl
          coverage: none

      - name: Install bubblewrap and age
        run: sudo apt-get install -y bubblewrap age

      # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The sandbox key's counterpart of the source job's check: a token sealed
      # to sandbox.pub opens to itself, and one sealed to agents.pub does not
      # open, so this job can never read a run record.
      - name: Check the sandbox key against both public keys
        env:
          AUDIT_SANDBOX_AGE_KEY: ${{ secrets.AUDIT_SANDBOX_AGE_KEY }}
        run: |
          dir=$(mktemp -d)
          mkdir "$dir/in" "$dir/open" "$dir/other"
          token=$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')
          printf '%s\n' "$token" > "$dir/in/token"
          own=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/sandbox.pub "$dir/in" "$dir/own.age")
          if ! bash .github/security-audit/seal.sh open AUDIT_SANDBOX_AGE_KEY "$own" "$dir/own.age" "$dir/open" \
            || [ "$(cat "$dir/open/token")" != "$token" ]; then
            echo "::error::a token sealed to sandbox.pub did not open to itself with AUDIT_SANDBOX_AGE_KEY"
            exit 1
          fi
          other=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$dir/in" "$dir/other.age")
          if bash .github/security-audit/seal.sh open AUDIT_SANDBOX_AGE_KEY "$other" "$dir/other.age" "$dir/other"; then
            echo "::error::AUDIT_SANDBOX_AGE_KEY opened a token sealed to agents.pub"
            exit 1
          fi
          rm -rf "$dir"
          echo "AUDIT_SANDBOX_AGE_KEY opens what is sealed to sandbox.pub and not what is sealed to agents.pub"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: poc-scripts-sandbox
          path: ${{ runner.temp }}/handoff

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: audit-site
          path: ${{ runner.temp }}/site-artifact

      - name: Check and open the scripts and the site
        id: open
        env:
          AUDIT_SANDBOX_AGE_KEY: ${{ secrets.AUDIT_SANDBOX_AGE_KEY }}
          SCRIPTS_SHA256: ${{ needs.poc-write.outputs.sandbox_sha256 }}
          SITE_SHA256: ${{ needs.build-site.outputs.sha256 }}
        run: |
          actual=$(sha256sum "$RUNNER_TEMP/site-artifact/audit-site.tar.gz" | cut -d' ' -f1)
          if [ "$actual" != "$SITE_SHA256" ]; then
            echo "::error::audit-site is not the file build-site uploaded (expected $SITE_SHA256, got $actual)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/site" "$RUNNER_TEMP/scripts"
          tar -xzf "$RUNNER_TEMP/site-artifact/audit-site.tar.gz" -C "$RUNNER_TEMP/site"
          bash .github/security-audit/seal.sh open AUDIT_SANDBOX_AGE_KEY "$SCRIPTS_SHA256" "$RUNNER_TEMP/handoff/poc-scripts-sandbox.age" "$RUNNER_TEMP/scripts"

      # The manifest is agent-written, so each entry is checked before use: at
      # most the first six items, slots a and b once each, a mode run-in-
      # sandbox.sh knows, and script and fixture paths that resolve to regular
      # files inside the opened scripts. A bad entry runs nothing and has no
      # record. The log names items by position only, never by fingerprint.
      - name: Run each script in the sandbox and seal its record
        id: run
        run: |
          scripts="$(cd "$RUNNER_TEMP/scripts" && pwd -P)"
          manifest="$scripts/poc-manifest.json"
          mkdir -p "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/record"
          if [ ! -f "$manifest" ] || [ -L "$manifest" ]; then
            echo "no poc-manifest.json, so no script runs"
            exit 0
          fi
          inside() { # relative path -> its resolved path inside the scripts, or nothing
            case "$1" in ''|/*|*..*) return 1 ;; esac
            [ ! -L "$scripts/$1" ] || return 1
            local p
            p=$(realpath -e -- "$scripts/$1" 2>/dev/null) || return 1
            case "$p" in "$scripts"/*) ;; *) return 1 ;; esac
            [ -f "$p" ] || return 1
            printf '%s' "$p"
          }
          count=$(jq 'if (.items | type) == "array" then [(.items | length), 6] | min else 0 end' "$manifest")
          missing=0
          for ((i = 0; i < count; i++)); do
            n=$((i + 1))
            for slot in a b; do
              entry=$(jq -c --argjson i "$i" --arg slot "$slot" '
                [.items[$i] | objects | .scripts | arrays | .[] | objects | select(.slot == $slot)] | first // empty' "$manifest")
              if [ -z "$entry" ]; then echo "item $n slot $slot: no script listed"; continue; fi
              fp=$(jq -r --argjson i "$i" '.items[$i] | objects | .fingerprint | strings' "$manifest")
              mode=$(jq -r '.mode | strings' <<<"$entry")
              script=$(jq -r '.script | strings' <<<"$entry")
              fixture=$(jq -r '.fixture | strings' <<<"$entry")
              if ! [[ "$fp" =~ ^[A-Za-z0-9][A-Za-z0-9._:/@+-]*$ ]] || { [ "$mode" != http ] && [ "$mode" != drush ]; }; then
                echo "item $n slot $slot: malformed entry, not run"; continue
              fi
              if ! script_path=$(inside "$script"); then echo "item $n slot $slot: script path refused, not run"; continue; fi
              fixture_path=""
              if [ -n "$fixture" ] && ! fixture_path=$(inside "$fixture"); then
                echo "item $n slot $slot: fixture path refused, not run"; continue
              fi
              name="poc-run-$n-$slot"
              mkdir "$RUNNER_TEMP/record/$name"
              rc=0
              if [ -n "$fixture_path" ]; then
                bash .github/security-audit/run-in-sandbox.sh "$fp" "$slot" "$mode" "$RUNNER_TEMP/site" "$script_path" "$fixture_path" > "$RUNNER_TEMP/record/$name/$name.json" || rc=$?
              else
                bash .github/security-audit/run-in-sandbox.sh "$fp" "$slot" "$mode" "$RUNNER_TEMP/site" "$script_path" > "$RUNNER_TEMP/record/$name/$name.json" || rc=$?
              fi
              if [ "$rc" -ne 0 ] || [ ! -s "$RUNNER_TEMP/record/$name/$name.json" ]; then
                echo "item $n slot $slot: run-in-sandbox.sh exited $rc and printed no record"
                rm -rf "$RUNNER_TEMP/record/$name"
                missing=$((missing + 1))
                continue
              fi
              bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$RUNNER_TEMP/record/$name" "$RUNNER_TEMP/sealed/$name.age" > /dev/null
              rm -rf "$RUNNER_TEMP/record/$name"
              echo "item $n slot $slot: record sealed"
            done
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing script(s) produced no run record"
            exit 1
          fi

      # Seals any record the step above wrote but did not seal before it
      # stopped, and lists every sealed record with its sha256.
      - name: Seal any record left and list the sealed records
        id: records
        if: always() && steps.open.outcome == 'success'
        run: |
          shopt -s nullglob
          for dir in "$RUNNER_TEMP"/record/poc-run-*; do
            name=$(basename "$dir")
            if [ -s "$dir/$name.json" ] && [ ! -e "$RUNNER_TEMP/sealed/$name.age" ]; then
              bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$dir" "$RUNNER_TEMP/sealed/$name.age" > /dev/null
            fi
            rm -rf "$dir"
          done
          map='{}'
          for f in "$RUNNER_TEMP"/sealed/poc-run-*.age; do
            map=$(jq -c --arg name "$(basename "$f" .age)" --arg sum "$(sha256sum "$f" | cut -d' ' -f1)" '. + {($name): $sum}' <<<"$map")
          done
          echo "records=$map" >> "$GITHUB_OUTPUT"
          echo "$(jq length <<<"$map") sealed run record(s)"

      # The reopen-records canary: this job's own key must open none of the
      # records it sealed. A run with no record seals a probe record the same
      # way first, so the check never passes on an empty set.
      - name: Canary, the sandbox key opens no sealed record
        if: always() && needs.prepare.outputs.canary == 'reopen-records' && steps.records.outcome == 'success'
        env:
          AUDIT_SANDBOX_AGE_KEY: ${{ secrets.AUDIT_SANDBOX_AGE_KEY }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/sealed/poc-run-*.age)
          if [ "${#files[@]}" -eq 0 ]; then
            mkdir -p "$RUNNER_TEMP/probe/poc-run-0-a"
            jq -n --arg token "$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" '{fingerprint: "canary-reopen-records", stdout: $token}' \
              > "$RUNNER_TEMP/probe/poc-run-0-a/poc-run-0-a.json"
            bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$RUNNER_TEMP/probe/poc-run-0-a" "$RUNNER_TEMP/probe/poc-run-0-a.age" > /dev/null
            files=("$RUNNER_TEMP/probe/poc-run-0-a.age")
          fi
          opened=0
          for f in "${files[@]}"; do
            dir=$(mktemp -d)
            if bash .github/security-audit/seal.sh open AUDIT_SANDBOX_AGE_KEY "$(sha256sum "$f" | cut -d' ' -f1)" "$f" "$dir"; then
              opened=$((opened + 1))
            fi
            rm -rf "$dir"
          done
          if [ "$opened" -ne 0 ]; then
            echo "::error::AUDIT_SANDBOX_AGE_KEY opened $opened of ${#files[@]} sealed record(s)"
            exit 1
          fi
          echo "AUDIT_SANDBOX_AGE_KEY opened none of ${#files[@]} sealed record(s)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.records.outcome == 'success'
        with:
          name: poc-run-records
          path: ${{ runner.temp }}/sealed/
          retention-days: 1
          if-no-files-found: ignore

  poc-decide:
    needs: [prepare, source, poc-write, poc-run]
    if: needs.prepare.outputs.go == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.prepare.outputs.run_jobs), 'poc-decide')
    runs-on: ubuntu-24.04
    environment: claude-agents
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AUDIT_INPUT_DIR: /mnt/audit/poc-decide/in
      AUDIT_OUTPUT_DIR: /mnt/audit/poc-decide/out
    outputs:
      sha256: ${{ steps.handoff.outputs.sha256 }}
      validators: ${{ steps.validators.outputs.validators }}
      cause: ${{ steps.cause.outputs.cause }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install age, and envsubst where the image lacks it
        run: |
          pkgs=(age)
          command -v envsubst >/dev/null || pkgs+=(gettext-base)
          sudo apt-get install -y "${pkgs[@]}"

      - name: Create the working directories
        run: |
          sudo mkdir -p "$AUDIT_INPUT_DIR/scripts" "$AUDIT_INPUT_DIR/records" "$AUDIT_OUTPUT_DIR"
          sudo chown -R "$(id -u):$(id -g)" /mnt/audit/poc-decide

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: audit-poc-write
          path: ${{ runner.temp }}/handoff

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: poc-scripts
          path: ${{ runner.temp }}/handoff

      # The state goes to the output directory, where apply-decide promotes
      # the run records beside the decisions; the scripts go to the input
      # directory, the root the manifest's paths are relative to.
      - name: Check and open the state and the scripts
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
          STATE_SHA256: ${{ needs.poc-write.outputs.state_sha256 }}
          SCRIPTS_SHA256: ${{ needs.poc-write.outputs.scripts_sha256 }}
        run: |
          bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$STATE_SHA256" "$RUNNER_TEMP/handoff/audit-poc-write.age" "$AUDIT_OUTPUT_DIR"
          bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$SCRIPTS_SHA256" "$RUNNER_TEMP/handoff/poc-scripts.age" "$AUDIT_INPUT_DIR/scripts"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.poc-run.outputs.records != '{}'
        with:
          name: poc-run-records
          path: ${{ runner.temp }}/handoff/records

      # Only the records in poc-run's name-to-sha256 map are opened, each
      # checked against its sha256 and required to hold exactly one regular
      # file with its own name.
      - name: Check and open the run records
        if: needs.poc-run.outputs.records != '{}'
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
          RECORDS: ${{ needs.poc-run.outputs.records }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value)"' <<<"$RECORDS" | while read -r name sum; do
            if ! [[ "$name" =~ ^poc-run-[1-9][0-9]*-[ab]$ && "$sum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::malformed entry in the run record map"
              exit 1
            fi
            dir=$(mktemp -d)
            bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$sum" "$RUNNER_TEMP/handoff/records/$name.age" "$dir"
            if [ "$(find "$dir" -mindepth 1 -printf '%P\n')" != "$name.json" ] || [ -L "$dir/$name.json" ] || [ ! -f "$dir/$name.json" ]; then
              echo "::error::$name does not hold exactly one regular file $name.json"
              exit 1
            fi
            mv "$dir/$name.json" "$AUDIT_INPUT_DIR/records/"
            rmdir "$dir"
          done

      - name: Compose the poc-decide agent's arguments
        id: args-poc-decide
        run: |
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit > "$RUNNER_TEMP/agent-args"
          line=$(grep '^AGENT_ARGS_AUDIT_POC_DECIDE=' "$RUNNER_TEMP/agent-args")
          echo "claude_args=${line#AGENT_ARGS_AUDIT_POC_DECIDE=}" >> "$GITHUB_OUTPUT"
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit-models poc_decide >> "$GITHUB_OUTPUT"

      - name: Render the poc-decide prompt
        id: prompt-poc-decide
        run: |
          export RUN_ID="$GITHUB_RUN_ID" SOURCE_REF="$GITHUB_SHA" GITHUB_ENV_PATH="$GITHUB_ENV"
          export OUTPUT_DIR="$AUDIT_OUTPUT_DIR" INPUT_DIR="$AUDIT_INPUT_DIR"
          envsubst "$PROMPT_VARS" < .github/security-audit/prompts/poc-decide.md > "$RUNNER_TEMP/prompt-poc-decide.md"
          bash .github/claude-review/tools/agent/emit-block.sh prompt "$RUNNER_TEMP/prompt-poc-decide.md" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the checkout and ~/.claude before the poc-decide agent
        id: before-poc-decide
        run: |
          bash .github/security-audit/check-agent-run.sh --fingerprint "$RUNNER_TEMP/fingerprint-poc-decide"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: poc-decide agent
        id: agent-poc-decide
        continue-on-error: true
        timeout-minutes: 45
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.args-poc-decide.outputs.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.args-poc-decide.outputs.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.args-poc-decide.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt-poc-decide.outputs.prompt }}
          claude_args: ${{ steps.args-poc-decide.outputs.claude_args }}
          show_full_output: 'false'
          display_report: 'false'

      - name: Record when the poc-decide agent ended
        id: after-poc-decide
        if: always() && steps.agent-poc-decide.outcome != 'skipped'
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run check (poc-decide agent)
        id: check-poc-decide
        if: always() && steps.agent-poc-decide.outcome != 'skipped'
        env:
          TRACE: ${{ steps.agent-poc-decide.outputs.execution_file }}
          MODEL: ${{ steps.args-poc-decide.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        run: bash .github/security-audit/check-agent-run.sh poc-decide "$TRACE" "$AGENT_TOOLS" "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/fingerprint-poc-decide" "$MODEL"

      - name: Outcome (poc-decide agent)
        id: outcome-poc-decide
        if: always() && steps.agent-poc-decide.outcome != 'skipped'
        env:
          TRACE: ${{ steps.agent-poc-decide.outputs.execution_file }}
          OUTCOME: ${{ steps.agent-poc-decide.outcome }}
          STARTED: ${{ steps.before-poc-decide.outputs.started }}
          ENDED: ${{ steps.after-poc-decide.outputs.ended }}
        run: |
          cause=$(bash .github/security-audit/agent-outcome.sh "$TRACE" "$OUTCOME" "$STARTED" "$ENDED" 45)
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "poc-decide agent: $cause"

      - name: Count the poc-decide agent's subagents
        if: always() && steps.check-poc-decide.outcome == 'success'
        env:
          TRACE: ${{ steps.agent-poc-decide.outputs.execution_file }}
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" count --job poc-decide --cap 6 --trace "$TRACE"

      - name: Apply the decisions
        if: always() && steps.check-poc-decide.outcome == 'success'
        env:
          TRACE: ${{ steps.agent-poc-decide.outputs.execution_file }}
        run: >-
          python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" apply-decide
          --manifest "$AUDIT_INPUT_DIR/scripts/poc-manifest.json" --records "$AUDIT_INPUT_DIR/records"
          --scripts "$AUDIT_INPUT_DIR/scripts" --entries "$AUDIT_OUTPUT_DIR" --trace "$TRACE"

      - name: Validators (after the decisions)
        id: validators
        if: always() && steps.check-poc-decide.outcome == 'success'
        run: |
          errors="$AUDIT_OUTPUT_DIR/validator-errors.txt"
          f=0 l=0
          node .github/security-audit/skill/validate-findings.cjs "$AUDIT_OUTPUT_DIR/findings.json" > "$errors" 2>&1 || f=$?
          node .github/security-audit/skill/validate-coverage-ledger.cjs "$AUDIT_OUTPUT_DIR/coverage-ledger.json" >> "$errors" 2>&1 || l=$?
          echo "validate-findings exit $f, validate-coverage-ledger exit $l, $(grep -c '^ERROR' "$errors" || true) error line(s)"
          if [ "$f" -eq 0 ] && [ "$l" -eq 0 ]; then result=pass; else result=fail; fi
          echo "validators=$result" >> "$GITHUB_OUTPUT"

      - name: Seal audit-poc to the agents key
        id: handoff
        run: |
          mkdir -p "$RUNNER_TEMP/handoff-out"
          sum=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/handoff-out/audit-poc.age")
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.handoff.outcome == 'success'
        with:
          name: audit-poc
          path: ${{ runner.temp }}/handoff-out/audit-poc.age
          retention-days: 1
          if-no-files-found: error

      - name: Name the job's cause
        id: cause
        if: always()
        env:
          CHECK: ${{ steps.check-poc-decide.outcome }}
          OUTCOME: ${{ steps.outcome-poc-decide.outputs.cause }}
        run: |
          if [ "$CHECK" = failure ]; then cause=run_check_failed
          elif [ -n "$OUTCOME" ]; then cause="$OUTCOME"
          else cause=job_failed
          fi
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "poc-decide job: $cause"

  # Runs whenever the source job succeeded, so a failed proof-of-concept
  # phase still ends in cross-checked records: its selected items are marked
  # with the failed phase and stay leads.
  cross-check:
    needs: [prepare, source, poc-write, poc-run, poc-decide]
    if: always() && needs.prepare.outputs.go == 'true' && github.ref == 'refs/heads/main' && needs.source.result == 'success' && contains(fromJSON(needs.prepare.outputs.run_jobs), 'cross-check')
    runs-on: ubuntu-24.04
    environment: claude-agents
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      AUDIT_INPUT_DIR: /mnt/audit/cross-check/in
      AUDIT_OUTPUT_DIR: /mnt/audit/cross-check/out
    outputs:
      sha256: ${{ steps.handoff.outputs.sha256 }}
      validators: ${{ steps.validators.outputs.validators }}
      cause: ${{ steps.cause.outputs.cause }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install age, and envsubst where the image lacks it
        run: |
          pkgs=(age)
          command -v envsubst >/dev/null || pkgs+=(gettext-base)
          sudo apt-get install -y "${pkgs[@]}"

      - name: Create the working directories
        run: |
          sudo mkdir -p "$AUDIT_INPUT_DIR/scripts" "$AUDIT_INPUT_DIR/records" "$AUDIT_OUTPUT_DIR"
          sudo chown -R "$(id -u):$(id -g)" /mnt/audit/cross-check

      # The state is audit-poc when poc-decide succeeded and its records pass
      # the validators; otherwise the last state before it, audit-poc-write
      # or audit-source. failed names the first proof-of-concept phase that
      # did not succeed, for fail-poc; a failed build-site leaves poc-write
      # skipped, so it is named as poc-write.
      - name: Choose the input state
        id: choose
        env:
          POC_WRITE: ${{ needs.poc-write.result }}
          POC_RUN: ${{ needs.poc-run.result }}
          POC_DECIDE: ${{ needs.poc-decide.result }}
          DECIDE_VALIDATORS: ${{ needs.poc-decide.outputs.validators }}
          DECIDE_SHA256: ${{ needs.poc-decide.outputs.sha256 }}
          WRITE_SHA256: ${{ needs.poc-write.outputs.state_sha256 }}
          SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
          RECORDS: ${{ needs.poc-run.outputs.records }}
        run: |
          failed=""
          if [ "$POC_DECIDE" = success ] && [ "$DECIDE_VALIDATORS" = pass ]; then
            name=audit-poc sha="$DECIDE_SHA256"
          else
            for job in poc-write:"$POC_WRITE" poc-run:"$POC_RUN" poc-decide:"$POC_DECIDE"; do
              if [ "${job#*:}" != success ]; then failed="${job%%:*}"; break; fi
            done
            failed="${failed:-poc-decide}"
            if [ "$POC_WRITE" = success ] && [ -n "$WRITE_SHA256" ]; then
              name=audit-poc-write sha="$WRITE_SHA256"
            else
              name=audit-source sha="$SOURCE_SHA256"
            fi
          fi
          scripts=false records=false
          if [ "$POC_WRITE" = success ]; then scripts=true; fi
          if [ "$POC_RUN" = success ] && [ -n "$RECORDS" ] && [ "$RECORDS" != '{}' ]; then records=true; fi
          printf 'name=%s\nsha256=%s\nfailed=%s\nscripts=%s\nrecords=%s\n' "$name" "$sha" "$failed" "$scripts" "$records" >> "$GITHUB_OUTPUT"
          echo "input state: $name${failed:+, failed phase: $failed}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ steps.choose.outputs.name }}
          path: ${{ runner.temp }}/handoff

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.choose.outputs.scripts == 'true'
        with:
          name: poc-scripts
          path: ${{ runner.temp }}/handoff

      - name: Check and open the state and the scripts
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
          NAME: ${{ steps.choose.outputs.name }}
          SHA256: ${{ steps.choose.outputs.sha256 }}
          SCRIPTS: ${{ steps.choose.outputs.scripts }}
          SCRIPTS_SHA256: ${{ needs.poc-write.outputs.scripts_sha256 }}
        run: |
          bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$SHA256" "$RUNNER_TEMP/handoff/$NAME.age" "$AUDIT_OUTPUT_DIR"
          if [ "$SCRIPTS" = true ]; then
            bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$SCRIPTS_SHA256" "$RUNNER_TEMP/handoff/poc-scripts.age" "$AUDIT_INPUT_DIR/scripts"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.choose.outputs.records == 'true'
        with:
          name: poc-run-records
          path: ${{ runner.temp }}/handoff/records

      - name: Check and open the run records
        if: steps.choose.outputs.records == 'true'
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
          RECORDS: ${{ needs.poc-run.outputs.records }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value)"' <<<"$RECORDS" | while read -r name sum; do
            if ! [[ "$name" =~ ^poc-run-[1-9][0-9]*-[ab]$ && "$sum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::malformed entry in the run record map"
              exit 1
            fi
            dir=$(mktemp -d)
            bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$sum" "$RUNNER_TEMP/handoff/records/$name.age" "$dir"
            if [ "$(find "$dir" -mindepth 1 -printf '%P\n')" != "$name.json" ] || [ -L "$dir/$name.json" ] || [ ! -f "$dir/$name.json" ]; then
              echo "::error::$name does not hold exactly one regular file $name.json"
              exit 1
            fi
            mv "$dir/$name.json" "$AUDIT_INPUT_DIR/records/"
            rmdir "$dir"
          done

      - name: Mark the selected items with the failed proof-of-concept phase
        if: steps.choose.outputs.failed != ''
        env:
          FAILED: ${{ steps.choose.outputs.failed }}
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" fail-poc --select "$AUDIT_OUTPUT_DIR/select.json" --job "$FAILED"

      - name: Select the records to cross-check
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" select-cross-check --out "$AUDIT_OUTPUT_DIR/list.json"

      - name: Compose the cross-check agent's arguments
        id: args-cross-check
        run: |
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit > "$RUNNER_TEMP/agent-args"
          line=$(grep '^AGENT_ARGS_AUDIT_CROSS_CHECK=' "$RUNNER_TEMP/agent-args")
          echo "claude_args=${line#AGENT_ARGS_AUDIT_CROSS_CHECK=}" >> "$GITHUB_OUTPUT"
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit-models cross_check >> "$GITHUB_OUTPUT"

      - name: Render the cross-check prompt
        id: prompt-cross-check
        run: |
          export RUN_ID="$GITHUB_RUN_ID" SOURCE_REF="$GITHUB_SHA" GITHUB_ENV_PATH="$GITHUB_ENV"
          export OUTPUT_DIR="$AUDIT_OUTPUT_DIR" INPUT_DIR="$AUDIT_INPUT_DIR"
          envsubst "$PROMPT_VARS" < .github/security-audit/prompts/cross-check.md > "$RUNNER_TEMP/prompt-cross-check.md"
          bash .github/claude-review/tools/agent/emit-block.sh prompt "$RUNNER_TEMP/prompt-cross-check.md" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the checkout and ~/.claude before the cross-check agent
        id: before-cross-check
        run: |
          bash .github/security-audit/check-agent-run.sh --fingerprint "$RUNNER_TEMP/fingerprint-cross-check"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cross-check agent
        id: agent-cross-check
        continue-on-error: true
        timeout-minutes: 45
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.args-cross-check.outputs.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.args-cross-check.outputs.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.args-cross-check.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt-cross-check.outputs.prompt }}
          claude_args: ${{ steps.args-cross-check.outputs.claude_args }}
          show_full_output: 'false'
          display_report: 'false'

      - name: Record when the cross-check agent ended
        id: after-cross-check
        if: always() && steps.agent-cross-check.outcome != 'skipped'
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run check (cross-check agent)
        id: check-cross-check
        if: always() && steps.agent-cross-check.outcome != 'skipped'
        env:
          TRACE: ${{ steps.agent-cross-check.outputs.execution_file }}
          MODEL: ${{ steps.args-cross-check.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        run: bash .github/security-audit/check-agent-run.sh cross-check "$TRACE" "$AGENT_TOOLS" "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/fingerprint-cross-check" "$MODEL"

      - name: Outcome (cross-check agent)
        id: outcome-cross-check
        if: always() && steps.agent-cross-check.outcome != 'skipped'
        env:
          TRACE: ${{ steps.agent-cross-check.outputs.execution_file }}
          OUTCOME: ${{ steps.agent-cross-check.outcome }}
          STARTED: ${{ steps.before-cross-check.outputs.started }}
          ENDED: ${{ steps.after-cross-check.outputs.ended }}
        run: |
          cause=$(bash .github/security-audit/agent-outcome.sh "$TRACE" "$OUTCOME" "$STARTED" "$ENDED" 45)
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "cross-check agent: $cause"

      - name: Count the cross-check agent's subagents
        if: always() && steps.check-cross-check.outcome == 'success'
        env:
          TRACE: ${{ steps.agent-cross-check.outputs.execution_file }}
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" count --job cross-check --cap 30 --trace "$TRACE"

      - name: Apply the cross-check
        id: apply-cross-check
        if: always() && steps.check-cross-check.outcome == 'success'
        env:
          TRACE: ${{ steps.agent-cross-check.outputs.execution_file }}
        run: |
          python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" apply-cross-check --entries "$AUDIT_OUTPUT_DIR" --trace "$TRACE" --out "$AUDIT_OUTPUT_DIR/tie-break-inputs.json"
          disputes=$(jq '.disputes | length' "$AUDIT_OUTPUT_DIR/tie-break-inputs.json")
          if [ "$disputes" -gt 0 ]; then tie_break=true; else tie_break=false; fi
          echo "tie_break=$tie_break" >> "$GITHUB_OUTPUT"
          echo "$disputes dispute(s) for the tie-break"

      - name: Compose the tie-break agent's arguments
        id: args-tie-break
        if: steps.apply-cross-check.outputs.tie_break == 'true'
        run: |
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit > "$RUNNER_TEMP/agent-args"
          line=$(grep '^AGENT_ARGS_AUDIT_TIE_BREAK=' "$RUNNER_TEMP/agent-args")
          echo "claude_args=${line#AGENT_ARGS_AUDIT_TIE_BREAK=}" >> "$GITHUB_OUTPUT"
          bash .github/claude-review/tools/agent/compose-agent-args.sh --audit-models tie_break >> "$GITHUB_OUTPUT"

      - name: Render the tie-break prompt
        id: prompt-tie-break
        if: steps.apply-cross-check.outputs.tie_break == 'true'
        run: |
          export RUN_ID="$GITHUB_RUN_ID" SOURCE_REF="$GITHUB_SHA" GITHUB_ENV_PATH="$GITHUB_ENV"
          export OUTPUT_DIR="$AUDIT_OUTPUT_DIR" INPUT_DIR="$AUDIT_INPUT_DIR"
          envsubst "$PROMPT_VARS" < .github/security-audit/prompts/tie-break.md > "$RUNNER_TEMP/prompt-tie-break.md"
          bash .github/claude-review/tools/agent/emit-block.sh prompt "$RUNNER_TEMP/prompt-tie-break.md" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the checkout and ~/.claude before the tie-break agent
        id: before-tie-break
        if: steps.apply-cross-check.outputs.tie_break == 'true'
        run: |
          bash .github/security-audit/check-agent-run.sh --fingerprint "$RUNNER_TEMP/fingerprint-tie-break"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Tie-break agent
        id: agent-tie-break
        if: steps.apply-cross-check.outputs.tie_break == 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.args-tie-break.outputs.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.args-tie-break.outputs.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.args-tie-break.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt-tie-break.outputs.prompt }}
          claude_args: ${{ steps.args-tie-break.outputs.claude_args }}
          show_full_output: 'false'
          display_report: 'false'

      - name: Record when the tie-break agent ended
        id: after-tie-break
        if: always() && steps.apply-cross-check.outputs.tie_break == 'true'
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run check (tie-break agent)
        id: check-tie-break
        if: always() && steps.apply-cross-check.outputs.tie_break == 'true'
        env:
          TRACE: ${{ steps.agent-tie-break.outputs.execution_file }}
          MODEL: ${{ steps.args-tie-break.outputs.CLAUDE_CODE_SUBAGENT_MODEL }}
        run: bash .github/security-audit/check-agent-run.sh cross-check "$TRACE" "$AGENT_TOOLS" "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/fingerprint-tie-break" "$MODEL"

      - name: Outcome (tie-break agent)
        id: outcome-tie-break
        if: always() && steps.apply-cross-check.outputs.tie_break == 'true'
        env:
          TRACE: ${{ steps.agent-tie-break.outputs.execution_file }}
          OUTCOME: ${{ steps.agent-tie-break.outcome }}
          STARTED: ${{ steps.before-tie-break.outputs.started }}
          ENDED: ${{ steps.after-tie-break.outputs.ended }}
        run: |
          cause=$(bash .github/security-audit/agent-outcome.sh "$TRACE" "$OUTCOME" "$STARTED" "$ENDED" 20)
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "tie-break agent: $cause"

      - name: Count the tie-break agent's subagents
        if: always() && steps.check-tie-break.outcome == 'success'
        env:
          TRACE: ${{ steps.agent-tie-break.outputs.execution_file }}
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" count --job tie-break --cap 3 --trace "$TRACE"

      - name: Apply the tie-breaks
        if: always() && steps.check-tie-break.outcome == 'success'
        env:
          TRACE: ${{ steps.agent-tie-break.outputs.execution_file }}
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" apply-tie-break --inputs "$AUDIT_OUTPUT_DIR/tie-break-inputs.json" --entries "$AUDIT_OUTPUT_DIR" --trace "$TRACE"

      # Without always(): after a failed run check or a refused merge the job
      # is failing, and nothing more is recorded or handed off.
      - name: Record the run status
        run: python3 -I .github/security-audit/merge-records.py --state "$AUDIT_OUTPUT_DIR" status

      - name: Validators (after the cross-check)
        id: validators
        run: |
          errors="$AUDIT_OUTPUT_DIR/validator-errors.txt"
          f=0 l=0
          node .github/security-audit/skill/validate-findings.cjs "$AUDIT_OUTPUT_DIR/findings.json" > "$errors" 2>&1 || f=$?
          node .github/security-audit/skill/validate-coverage-ledger.cjs "$AUDIT_OUTPUT_DIR/coverage-ledger.json" >> "$errors" 2>&1 || l=$?
          echo "validate-findings exit $f, validate-coverage-ledger exit $l, $(grep -c '^ERROR' "$errors" || true) error line(s)"
          if [ "$f" -eq 0 ] && [ "$l" -eq 0 ]; then result=pass; else result=fail; fi
          echo "validators=$result" >> "$GITHUB_OUTPUT"

      - name: Seal audit-final to the agents key
        id: handoff
        run: |
          mkdir -p "$RUNNER_TEMP/handoff-out"
          sum=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$AUDIT_OUTPUT_DIR" "$RUNNER_TEMP/handoff-out/audit-final.age")
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.handoff.outcome == 'success'
        with:
          name: audit-final
          path: ${{ runner.temp }}/handoff-out/audit-final.age
          retention-days: 1
          if-no-files-found: error

      - name: Name the job's cause
        id: cause
        if: always()
        env:
          CHECK: ${{ steps.check-cross-check.outcome }}
          CHECK_TIE_BREAK: ${{ steps.check-tie-break.outcome }}
          OUTCOME: ${{ steps.outcome-cross-check.outputs.cause }}
          OUTCOME_TIE_BREAK: ${{ steps.outcome-tie-break.outputs.cause }}
        run: |
          if [ "$CHECK" = failure ] || [ "$CHECK_TIE_BREAK" = failure ]; then cause=run_check_failed
          elif [ -n "$OUTCOME" ] && [ "$OUTCOME" != ok ]; then cause="$OUTCOME"
          elif [ -n "$OUTCOME_TIE_BREAK" ]; then cause="$OUTCOME_TIE_BREAK"
          elif [ -n "$OUTCOME" ]; then cause="$OUTCOME"
          else cause=job_failed
          fi
          echo "cause=$cause" >> "$GITHUB_OUTPUT"
          echo "cross-check job: $cause"

  # The only job that writes to the issue, as github-actions[bot] with
  # GITHUB_TOKEN. Its id is its display name, report, which
  # check-audit-health.sh looks for. claude-agents holds the agents key it
  # opens the state with; no agent runs here.
  report:
    needs: [prepare, source, build-site, poc-write, poc-run, poc-decide, cross-check]
    if: always() && needs.prepare.outputs.go == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.prepare.outputs.run_jobs), 'report')
    runs-on: ubuntu-24.04
    environment: claude-agents
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install age
        run: sudo apt-get install -y age

      # audit-final when the cross-check succeeded and its records pass the
      # validators, then audit-poc under the same rule, then the state before
      # them; none when no job handed off a state.
      - name: Choose the input hand-off
        id: choose
        env:
          SOURCE: ${{ needs.source.result }}
          SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
          POC_WRITE: ${{ needs.poc-write.result }}
          WRITE_SHA256: ${{ needs.poc-write.outputs.state_sha256 }}
          POC_DECIDE: ${{ needs.poc-decide.result }}
          DECIDE_VALIDATORS: ${{ needs.poc-decide.outputs.validators }}
          DECIDE_SHA256: ${{ needs.poc-decide.outputs.sha256 }}
          CROSS_CHECK: ${{ needs.cross-check.result }}
          CROSS_CHECK_VALIDATORS: ${{ needs.cross-check.outputs.validators }}
          CROSS_CHECK_SHA256: ${{ needs.cross-check.outputs.sha256 }}
        run: |
          name="" sha=""
          if [ "$CROSS_CHECK" = success ] && [ "$CROSS_CHECK_VALIDATORS" = pass ]; then
            name=audit-final sha="$CROSS_CHECK_SHA256"
          elif [ "$POC_DECIDE" = success ] && [ "$DECIDE_VALIDATORS" = pass ]; then
            name=audit-poc sha="$DECIDE_SHA256"
          elif [ "$POC_WRITE" = success ] && [ -n "$WRITE_SHA256" ]; then
            name=audit-poc-write sha="$WRITE_SHA256"
          elif [ "$SOURCE" = success ] && [ -n "$SOURCE_SHA256" ]; then
            name=audit-source sha="$SOURCE_SHA256"
          fi
          printf 'name=%s\nsha256=%s\n' "$name" "$sha" >> "$GITHUB_OUTPUT"
          echo "input hand-off: ${name:-none}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.choose.outputs.name != ''
        with:
          name: ${{ steps.choose.outputs.name }}
          path: ${{ runner.temp }}/handoff

      # Step 1 of the report: check and open the input hand-off.
      - name: Check and open the input hand-off
        id: state
        if: steps.choose.outputs.name != ''
        env:
          AUDIT_AGENTS_AGE_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
          NAME: ${{ steps.choose.outputs.name }}
          SHA256: ${{ steps.choose.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          bash .github/security-audit/seal.sh open AUDIT_AGENTS_AGE_KEY "$SHA256" "$RUNNER_TEMP/handoff/$NAME.age" "$RUNNER_TEMP/state"

      # Step 2: the state the next run reads, exactly audit-state.age, holding
      # the four state files the hand-off has.
      - name: Seal the state files
        id: seal
        if: steps.state.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/audit-state-in" "$RUNNER_TEMP/audit-state"
          for name in coverage-ledger.json findings.json disputed.json audit-history.json; do
            if [ -f "$RUNNER_TEMP/state/$name" ] && [ ! -L "$RUNNER_TEMP/state/$name" ]; then
              cp "$RUNNER_TEMP/state/$name" "$RUNNER_TEMP/audit-state-in/"
            fi
          done
          sum=$(bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$RUNNER_TEMP/audit-state-in" "$RUNNER_TEMP/audit-state/audit-state.age")
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      # Step 3: the body, with the sealed state's sha256 in its marker.
      - name: Render the issue body
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          CANARY: ${{ needs.prepare.outputs.canary }}
          SOURCE: ${{ needs.source.result }}
          SOURCE_CAUSE: ${{ needs.source.outputs.cause }}
          CROSS_CHECK: ${{ needs.cross-check.result }}
          CROSS_CHECK_CAUSE: ${{ needs.cross-check.outputs.cause }}
          CROSS_CHECK_VALIDATORS: ${{ needs.cross-check.outputs.validators }}
          PRIOR_MARKER: ${{ needs.source.outputs.prior_marker }}
          STATE_SHA256: ${{ steps.seal.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/body"
          jq -n --argjson publish "$PUBLISH" --arg canary "$CANARY" \
            --arg source "$SOURCE" --arg source_cause "$SOURCE_CAUSE" \
            --arg cross "$CROSS_CHECK" --arg cross_cause "$CROSS_CHECK_CAUSE" --arg validators "$CROSS_CHECK_VALIDATORS" \
            '{publish: $publish, canary: $canary,
              source: {result: $source, cause: $source_cause},
              cross_check: {result: $cross, cause: $cross_cause, validators: $validators}}' > "$RUNNER_TEMP/jobs.json"
          printf '%s' "$PRIOR_MARKER" > "$RUNNER_TEMP/previous-marker.json"
          if [ -n "$STATE_SHA256" ]; then
            python3 -I .github/security-audit/render-issue.py --state "$RUNNER_TEMP/state" --state-sha256 "$STATE_SHA256" --run-id "$GITHUB_RUN_ID" \
              --jobs "$RUNNER_TEMP/jobs.json" --previous-marker "$RUNNER_TEMP/previous-marker.json" --out "$RUNNER_TEMP/body/issue.md"
          else
            python3 -I .github/security-audit/render-issue.py --run-id "$GITHUB_RUN_ID" \
              --jobs "$RUNNER_TEMP/jobs.json" --previous-marker "$RUNNER_TEMP/previous-marker.json" --out "$RUNNER_TEMP/body/issue.md"
          fi

      # Step 4: nothing is published until the body and the records are
      # compared with every secret this job holds. A match, or a screen that
      # cannot run, replaces the body with the fixed notice, which carries no
      # state marker.
      - name: Screen the body for the job's secrets
        id: screen
        continue-on-error: true
        env:
          HELD_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HELD_GITHUB_TOKEN: ${{ github.token }}
          HELD_AGENTS_KEY: ${{ secrets.AUDIT_AGENTS_AGE_KEY }}
        run: |
          REVIEW_SECRETS_JSON=$(jq -n '{CLAUDE_CODE_OAUTH_TOKEN: env.HELD_OAUTH_TOKEN, GITHUB_TOKEN: env.HELD_GITHUB_TOKEN, AUDIT_AGENTS_AGE_KEY: env.HELD_AGENTS_KEY}')
          export REVIEW_SECRETS_JSON
          if [ -f "$RUNNER_TEMP/state/findings.json" ]; then
            REVIEW_SCREEN_ONLY=1 bash .github/claude-review/tools/review/keep-trace.sh "$RUNNER_TEMP/screen" audit "$GITHUB_SHA" "$RUNNER_TEMP/body/issue.md" "$RUNNER_TEMP/state/findings.json"
          else
            REVIEW_SCREEN_ONLY=1 bash .github/claude-review/tools/review/keep-trace.sh "$RUNNER_TEMP/screen" audit "$GITHUB_SHA" "$RUNNER_TEMP/body/issue.md"
          fi

      - name: Replace the body with the screen-failure notice
        if: steps.screen.outcome != 'success'
        run: python3 -I .github/security-audit/render-issue.py --screen-failed --out "$RUNNER_TEMP/body/issue.md"

      # Step 5: published to the issue chosen by find-audit-issue.sh, the rule
      # the prior-state fetch reads by. A closed issue is reopened when the
      # state marker lists any fingerprint still open.
      - name: Publish the issue
        id: publish
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.canary == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="$RUNNER_TEMP/body/issue.md"
          gh label create security-audit --repo "$REPO" --color B60205 --description "Security audit findings" --force
          number=$(bash .github/security-audit/find-audit-issue.sh "$REPO")
          if [ -z "$number" ]; then
            url=$(gh issue create --repo "$REPO" --title "Security audit" --label security-audit --body-file "$body")
            number="${url##*/}"
          else
            gh issue edit "$number" --repo "$REPO" --body-file "$body"
            open=$(sed -n 's/^<!-- security-audit-state \(.*\) -->$/\1/p' "$body" | jq -s 'map(.fingerprints | length) | add // 0')
            if [ "$(gh issue view "$number" --repo "$REPO" --json state --jq .state)" = CLOSED ] && [ "$open" -gt 0 ]; then
              gh issue reopen "$number" --repo "$REPO"
            fi
          fi
          if grep -q '^<!-- security-audit-state ' "$body"; then marker=true; else marker=false; fi
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "published to issue $number, state marker: $marker"

      - name: Seal the body when it is not published
        id: seal-body
        if: needs.prepare.outputs.publish != 'true' || needs.prepare.outputs.canary != 'none'
        run: bash .github/security-audit/seal.sh seal .github/security-audit/keys/agents.pub "$RUNNER_TEMP/body" "$RUNNER_TEMP/audit-report.age"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.seal-body.outcome == 'success'
        with:
          name: audit-report
          path: ${{ runner.temp }}/audit-report.age
          retention-days: 1
          if-no-files-found: error

      # Step 6: the state is kept only when the published body carries its
      # marker, so a state no marker names is never left for the next run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.publish.outputs.marker == 'true'
        with:
          name: audit-state
          path: ${{ runner.temp }}/audit-state/audit-state.age
          retention-days: 90
          if-no-files-found: error
