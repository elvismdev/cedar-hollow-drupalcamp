name: Pantheon nightly smoke

# Read-only checks against the shared Pantheon environment: pages, the agenda
# endpoint's caching headers, and the axe and reflow accessibility scans.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Pantheon environment to check
        default: dev
        type: choice
        options: [dev, test, live]
  # deploy-dev.yml runs these suites against Dev after each deploy, from the
  # deployed commit (ref).
  workflow_call:
    inputs:
      environment:
        type: string
        default: dev
      ref:
        type: string
        default: ''
    secrets:
      PANTHEON_BOT_BYPASS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://${{ inputs.environment || 'dev' }}-cedar-hollow-demo.pantheonsite.io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # --with-deps runs apt-get update, which can hang on an unreachable
      # Ubuntu mirror, so a stalled install fails here instead of at the job's
      # limit.
      - run: npm ci && npx playwright install --with-deps chromium
        timeout-minutes: 10
        working-directory: tests
      # Only this step and the scrub below read the bot-bypass token, not the
      # npm install above.
      - run: npx playwright test --project=smoke --project=a11y
        working-directory: tests
        env:
          PANTHEON_BOT_BYPASS_TOKEN: ${{ secrets.PANTHEON_BOT_BYPASS_TOKEN }}
      # A failed API request writes its call log, the x-pantheon-bot-bypass
      # header value included, into test-results/*/error-context.md. GitHub
      # masks secrets in logs but not in artifacts, and this artifact is
      # public, so the token is removed from the files first. The upload runs
      # only when the scrub succeeded: a file that still holds the token, or
      # one it could not rewrite, fails this step and nothing is uploaded.
      - name: Remove the bot-bypass token from the files to upload
        id: scrub
        if: failure()
        run: python3 scripts/scrub-secret.py --env PANTHEON_BOT_BYPASS_TOKEN tests/test-results tests/a11y-results
        env:
          PANTHEON_BOT_BYPASS_TOKEN: ${{ secrets.PANTHEON_BOT_BYPASS_TOKEN }}
      - if: failure() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pantheon-smoke
          path: |
            tests/test-results
            tests/a11y-results
          retention-days: 14
