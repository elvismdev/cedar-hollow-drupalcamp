name: Pantheon nightly smoke

# Read-only checks against the shared Pantheon environment: pages, the agenda
# endpoint's caching headers, and the axe and reflow accessibility scans.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Pantheon environment to check
        default: dev
        type: choice
        options: [dev, test, live]
  # deploy-dev.yml runs these suites against Dev after each deploy, from the
  # deployed commit (ref).
  workflow_call:
    inputs:
      environment:
        type: string
        default: dev
      ref:
        type: string
        default: ''
    secrets:
      PANTHEON_BOT_BYPASS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://${{ inputs.environment || 'dev' }}-cedar-hollow-demo.pantheonsite.io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests
      # Only this step reads the bot-bypass token, not the npm install above.
      - run: npx playwright test --project=smoke --project=a11y
        working-directory: tests
        env:
          PANTHEON_BOT_BYPASS_TOKEN: ${{ secrets.PANTHEON_BOT_BYPASS_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pantheon-smoke
          path: |
            tests/test-results
            tests/a11y-results
          retention-days: 14
